# Alembic configuration for the MEMBER service.
#
# The URL below is a PLACEHOLDER ONLY. `alembic/env.py` always replaces it with
# `settings.database_url` (the DATABASE_URL env var, or .env), so the value here
# is never used at runtime and must never contain a real credential.

[alembic]
# Path to the migration scripts, relative to this file (%(here)s).
script_location = alembic

# Add the project root to sys.path so `import app...` works from any CWD.
prepend_sys_path = .

# os.pathsep based splitting for multi-path options.
path_separator = os

# Migration file names: 0001_initial.py, 0002_add_something.py, ...
file_template = %%(rev)s_%%(slug)s

# Truncate long slugs (keeps file names readable on every filesystem).
truncate_slug_length = 40

# Encoding used when writing new revision files from script.py.mako.
output_encoding = utf-8

# Placeholder: overridden at runtime by alembic/env.py from settings.database_url.
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# Optional auto-formatting of freshly generated revisions.
# hooks = ruff
# ruff.type = module
# ruff.module = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME


# ---------------------------------------------------------------------------
# Logging - consumed by alembic/env.py through logging.config.fileConfig().
# Works out of the box for `alembic upgrade head`, `downgrade`, `current`, ...
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
